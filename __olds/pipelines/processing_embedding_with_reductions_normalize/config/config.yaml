global:
  output_root: "results"
  embedding_root: "../../numerical_representation_data"

dataset:
  name: "antioxidant_proteins"
  input_data: "../data/sequences.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"

experiment:
  name: "embedding_exploring_normalize"

representation:
  enabled: true
  run_embedding: true
  method: "sylphy_embedding"
  model: "facebook/esm2_t6_8M_UR50D"
  model_alias: "esm2_t6_8M_UR50D"
  device: "cuda"
  precision: "fp32"
  batch_size: 16
  output_format: "csv"

analysis:
  enabled: true
  script: "../../notebooks_and_scripts/scripts_for_pipelines/embedding_analysis_space.py"
  feature_prefix: "p_"
  prefix: "esm2_t6"
  random_state: 42
  tsne_perplexity: 30.0
  tsne_max_iter: 1000
  umap_neighbors: 15
  umap_min_dist: 0.1
  umap_metric: "euclidean"
  scaling_strategy: "l2"

reduction:
  enabled: true
  script: "../../notebooks_and_scripts/scripts_for_pipelines/run_biosieve_reducers_from_percentiles.py"
  biosieve_exec: "biosieve"
  strategy: "embedding_cosine"
  n_jobs: 8

splits:
  enabled: true
  script: "../../notebooks_and_scripts/scripts_for_pipelines/run_biosieve_splits_from_reduction_summary.py"
  biosieve_exec: "biosieve"
  strategy: "distance_aware_kfold"
  n_splits: 5
  seed: 13
  val_size: 0.1
  metric: "cosine"