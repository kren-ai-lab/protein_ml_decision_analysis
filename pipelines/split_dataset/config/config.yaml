# Configuration for the split-dataset workflow.
# Edit paths, active representations, split sources, and split strategies as needed.

global:
  # Base paths used to find previous workflow outputs and write split outputs.
  output_root: "../.."
  representation_root: "../../numerical_representation_data"
  reduction_root: "../.."
  seeds_file: "../../general_configs/random_seeds_3.csv"


dataset:
  # Input dataset and column names used by the workflow.
  name: "test2"
  input_data: "../data/test2.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"


representations:
  # Available feature spaces for training and/or distance-aware splitting.
  # Keys are referenced by cross_features.train_representations,
  # split_features.split_representation, and split_sources.*.representation_key.
  prot_t5_xl_uniref50:
    method: "sylphy_embedding"
    model_alias: "prot_t5_xl_uniref50"
    output_name: "prot_t5_xl_uniref50"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "prot_t5_xl_uniref50"

  # ankh2_ext1:
  #   method: "sylphy_embedding"
  #   model_alias: "ankh2_ext1"
  #   output_name: "ankh2_ext1"
  #   feature_mode: "embeddings"
  #   metric: "cosine"
  #   prefix: "ankh2"

  esm2_t6_8M_UR50D:
    method: "sylphy_embedding"
    model_alias: "esm2_t6_8M_UR50D"
    output_name: "esm2_t6_8M_UR50D"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "esm2_t6_8M_UR50D"

  mistral_Prot_v1_134M:
    method: "sylphy_embedding"
    model_alias: "mistral_Prot_v1_134M"
    output_name: "mistral_Prot_v1_134M"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "mistral_Prot_v1_134M"


split_sources:
  # Dataset sources to split.
  # Enable no_reduced for the original dataset, or one of the reduced sources
  # generated by the reduction workflow.
  no_reduced:
    enabled: false

  reduced_distance:
    enabled: true
    reductions:
      esm2_t6_8M_UR50D:
        enabled: true
        representation_key: "esm2_t6_8M_UR50D"
        root: "../../reduced_distance/test2/esm2_t6_embedding_distance_reduction"
        thresholds: "auto"

  reduced_homology:
    enabled: false
    reductions:
      homology_mmseqs2_reduction:
        enabled: false
        root: "../../reduced_homology/test2/homology_mmseqs2_reduction"
        thresholds: "auto"

  reduced_descriptor:
    enabled: false
    reductions:
      onehot_descriptor:
        enabled: false
        representation_key: "onehot"
        root: "../../reduced_descriptor/test2/onehot_descriptor_reduction"
        thresholds: "auto"


split_strategies:
  # Split methods executed for each source, seed, and training representation.
  biosieve_exec: "biosieve"

  random_kfold:
    enabled: false
    n_splits: 5
    shuffle: true
    val_size: 0.1

  stratified_kfold:
    enabled: false
    n_splits: 5
    shuffle: true
    val_size: 0.1
    dropna: true
    cast_to_str: false

  distance_aware_kfold:
    enabled: true
    n_splits: 5
    val_size: 0.1
    shuffle_ties: true

    # Used only when the split representation has feature_mode: "descriptors".
    descriptor_modes:
      - no_norm
      # - norm


split_features:
  # Optional separation between the representation used for training and the
  # representation used to compute distance-aware splits.
  #
  # Options for split_representation:
  #   "same_as_train"      use each training representation as split space
  #   "same_as_reduction"  use the reduction representation when available
  #   "<representation>"   use a fixed representation key for all splits
  enabled: true
  split_representation: "mistral_Prot_v1_134M"
  include_split_in_scenario_name: true


cross_features:
  # Training/materialization representations to evaluate.
  # Each active representation is crossed with the enabled split sources.
  enabled: true
  train_representations:
    - "prot_t5_xl_uniref50"
    # - "ankh2_ext1"
    # - "esm2_t6_8M_UR50D"
    # - "mistral_Prot_v1_134M"


output:
  # Final split outputs and temporary materialized inputs.
  root: "../../split_process"
  include_dataset_folder: true
  materialized_root: "../../split_process_inputs/test2"


validation:
  # Sanity checks for generated train/val/test folds.
  enabled: true
  fail_on_invalid: false

  min_classes: 2
  min_classes_per_split: 2
  required_split_files:
    - "train.csv"
    - "val.csv"
    - "test.csv"

  remove_stale_outputs_before_split: true
  keep_invalid_fold_files: false
  remove_invalid_run_dirs: true

cleanup:
  # Keep false while debugging. Distance-aware split params depend on temporary
  # arrays stored under split_process_inputs/<dataset>.
  remove_materialized_inputs: false
