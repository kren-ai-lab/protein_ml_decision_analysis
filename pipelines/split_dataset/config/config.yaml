# Configuration for the split-dataset workflow.
# This run regenerates the six scenarios that use:
# - one-hot as model-input representation;
# - one of six pLM spaces for redundancy reduction;
# - one-hot as the distance-aware split space.

global:
  # Base paths used to find representations and reduction outputs.
  output_root: "../.."
  representation_root: "../../numerical_representation_data"
  reduction_root: "../.."

  # Thirty data-partition seeds used in the manuscript.
  seeds_file: "../../general_configs/random_seeds_30.csv"


dataset:
  # Input dataset and column names.
  name: "antioxidant_proteins"
  input_data: "../data/sequences.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"


representations:
  # The six pLM representations must be declared because they identify the
  # representation space used for each redundancy reduction. They are not
  # used as model-input features in this run.

  esmc_300m:
    method: "sylphy_embedding"
    model_alias: "esmc_300m"
    output_name: "esmc_300m"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "esmc_300m"

  prot_bert:
    method: "sylphy_embedding"
    model_alias: "prot_bert"
    output_name: "prot_bert"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "prot_bert"

  ankh2_ext1:
    method: "sylphy_embedding"
    model_alias: "ankh2_ext1"
    output_name: "ankh2_ext1"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "ankh2_ext1"

  esm2_t6_8M_UR50D:
    method: "sylphy_embedding"
    model_alias: "esm2_t6_8M_UR50D"
    output_name: "esm2_t6_8M_UR50D"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "esm2_t6_8M_UR50D"

  prot_t5_xl_uniref50:
    method: "sylphy_embedding"
    model_alias: "prot_t5_xl_uniref50"
    output_name: "prot_t5_xl_uniref50"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "prot_t5_xl_uniref50"

  mistral_Prot_v1_134M:
    method: "sylphy_embedding"
    model_alias: "mistral_Prot_v1_134M"
    output_name: "mistral_Prot_v1_134M"
    feature_mode: "embeddings"
    metric: "cosine"
    prefix: "mistral_Prot_v1_134M"

  # One-hot is used both as model input and as the distance-aware split space.
  # Euclidean distance is calculated on the descriptor vectors.
  onehot:
    method: "sylphy_one_hot"
    model_alias: "one_hot"
    output_name: "onehot"
    feature_mode: "descriptors"
    metric: "euclidean"
    feature_prefix: "p_"
    prefix: "onehot"


split_sources:
  # The unreduced dataset is not regenerated in this run.
  no_reduced:
    enabled: false

  # Enable the existing datasets reduced independently in the six pLM spaces.
  reduced_distance:
    enabled: true
    reductions:
      esmc_300m:
        enabled: true
        representation_key: "esmc_300m"
        root: "../../reduced_distance/antioxidant_proteins/esmc_300m_embedding_distance_reduction"
        thresholds: "auto"

      prot_bert:
        enabled: true
        representation_key: "prot_bert"
        root: "../../reduced_distance/antioxidant_proteins/prot_bert_embedding_distance_reduction"
        thresholds: "auto"

      ankh2_ext1:
        enabled: true
        representation_key: "ankh2_ext1"
        root: "../../reduced_distance/antioxidant_proteins/ankh2_ext1_embedding_distance_reduction"
        thresholds: "auto"

      esm2_t6_8M_UR50D:
        enabled: true
        representation_key: "esm2_t6_8M_UR50D"
        root: "../../reduced_distance/antioxidant_proteins/esm2_t6_embedding_distance_reduction"
        thresholds: "auto"

      prot_t5_xl_uniref50:
        enabled: true
        representation_key: "prot_t5_xl_uniref50"
        root: "../../reduced_distance/antioxidant_proteins/prot_t5_embedding_distance_reduction"
        thresholds: "auto"

      mistral_Prot_v1_134M:
        enabled: true
        representation_key: "mistral_Prot_v1_134M"
        root: "../../reduced_distance/antioxidant_proteins/mistral_prot_embedding_distance_reduction"
        thresholds: "auto"

  # Homology-reduced datasets are not used in this run.
  reduced_homology:
    enabled: false
    reductions:
      homology_mmseqs2_reduction:
        enabled: false
        root: "../../reduced_homology/antioxidant_proteins/homology_mmseqs2_reduction"
        thresholds: "auto"

  # The one-hot descriptor reduction is a different analysis and is therefore
  # not used to recreate the six onehot_reduced_distance_by_* scenarios.
  reduced_descriptor:
    enabled: false
    reductions:
      onehot_descriptor:
        enabled: false
        representation_key: "onehot"
        root: "../../reduced_descriptor/onehot_descriptor_reduction"
        thresholds: "auto"


split_strategies:
  # Split methods executed for each reduction threshold and seed.
  biosieve_exec: "biosieve"

  # These strategies are not required for the six distance-aware scenarios.
  random_kfold:
    enabled: false
    n_splits: 5
    shuffle: true
    val_size: 0.1

  stratified_kfold:
    enabled: false
    n_splits: 5
    shuffle: true
    val_size: 0.1
    dropna: true
    cast_to_str: false

  distance_aware_kfold:
    enabled: true
    n_splits: 5
    val_size: 0.1
    shuffle_ties: true

    # Two explicitly separated one-hot split variants.
    # no_norm uses the raw binary vectors.
    # norm standardises the descriptors before the Euclidean split.
    descriptor_modes:
      - no_norm
      - norm


split_features:
  # When disabled, the representation used for training is also used as the
  # distance-aware split space. Because training uses one-hot, splitting also
  # uses one-hot with the Euclidean metric declared above.
  #
  # Keeping this disabled also preserves the original scenario names:
  # onehot_reduced_distance_by_<pLM>.
  enabled: false
  split_representation: "same_as_train"
  include_split_in_scenario_name: false


cross_features:
  # Only one-hot is supplied to the classifiers in this run.
  # It is crossed with all six enabled pLM-reduced dataset sources.
  enabled: true
  train_representations:
    - "onehot"


output:
  # Final split outputs and temporary materialized inputs.
  root: "../../split_process"
  include_dataset_folder: true
  materialized_root: "../../split_process_inputs/antioxidant_proteins"


validation:
  # Sanity checks for generated train/validation/test folds.
  enabled: true
  fail_on_invalid: false

  min_classes: 2
  min_classes_per_split: 2

  required_split_files:
    - "train.csv"
    - "val.csv"
    - "test.csv"

  # Remove files remaining from an earlier attempt before regenerating a split.
  remove_stale_outputs_before_split: true
  keep_invalid_fold_files: false
  remove_invalid_run_dirs: true


cleanup:
  # Keep false because the distance-aware parameters depend on the temporary
  # arrays stored under split_process_inputs/antioxidant_proteins.
  remove_materialized_inputs: false
