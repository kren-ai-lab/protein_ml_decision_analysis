# Configuration for the dataset-reduction workflow.
# Update paths and identifiers before running the workflow on a new dataset.
# Relative paths are resolved from the directory where Snakemake is invoked.

global:
  # Root directories for workflow outputs and precomputed representations.
  output_root: "../.."
  embedding_root: "../../numerical_representation_data"

dataset:
  # Dataset identifier, source file, and required column names.
  name: "antioxidant_proteins"
  input_data: "../data/sequences.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"

representations:
  # Numerical representations available to the reduction strategies.
  # Unless explicitly overridden, each representation is expected under:
  # <embedding_root>/<dataset.name>/<method>/<model_alias>/
  esm2_t6:
    label: "ESM2-8M"
    method: "sylphy_embedding"
    model: "facebook/esm2_t6_8M_UR50D"
    model_alias: "esm2_t6_8M_UR50D"
    prefix: "esm2_t6_8M_UR50D"

  # Additional representations can be enabled after their files have been generated.
  # prot_t5:
  #   label: "ProtT5-XL"
  #   method: "sylphy_embedding"
  #   model: "Rostlab/prot_t5_xl_uniref50"
  #   model_alias: "prot_t5_xl_uniref50"
  #   prefix: "prot_t5"

  onehot:
    label: "One-hot"
    method: "sylphy_one_hot"
    model: "one_hot"
    model_alias: "one_hot"
    prefix: "onehot"
    feature_prefix: "p_"
    analysis:
      # Null values use the standard paths inferred by the Snakefile.
      # Set an explicit path only when the upstream output layout differs.
      percentiles_csv: null

reductions:
  embedding_distance:
    # Representation-aware reduction using percentile-derived similarity thresholds.
    enabled: false
    representation_keys:
      - "esm2_t6"
      # - "prot_t5"

    script: "../../notebooks_and_scripts/scripts_for_pipelines/run_biosieve_reducers_from_percentiles.py"
    biosieve_exec: "biosieve"
    strategy: "embedding_cosine"
    n_jobs: 8
    output_dir: null

  homology:
    # Sequence-level redundancy reduction using MMseqs2 through BioSieve.
    enabled: false
    label: "Homology MMseqs2"
    representation_key: "esm2_t6"
    experiment_name: "homology_mmseqs2_reduction"

    biosieve_exec: "biosieve"
    strategy: "mmseqs2"
    thresholds: [0.9, 0.7, 0.5, 0.3]
    coverage: 0.8
    extra_params: {}
    output_dir: null

  onehot_descriptor:
    # Descriptor-based reduction using Euclidean distances between unscaled
    # binary one-hot feature vectors.
    enabled: true
    label: "One-hot descriptor"
    representation_key: "onehot"
    experiment_name: "onehot_descriptor_reduction"

    script: "../../notebooks_and_scripts/scripts_for_pipelines/run_descriptor_euclidean_reduction.py"
    biosieve_exec: "biosieve"
    strategy: "descriptor_euclidean"
    descriptor_prefix: "p_"
    percentile_col: "reduction_percentile"
    threshold_col: "distance_threshold"
    n_jobs: 8
    output_dir: null

analysis:
  # Optional post-reduction summaries and figures.
  enabled: true
  script: "../../notebooks_and_scripts/scripts_for_pipelines/summary_reduction.py"
  output_dir: null
  general: true
  by_label: true
  fig_format: "png"
  dpi: 300
