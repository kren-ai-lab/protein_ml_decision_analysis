# Snakemake configuration for the reduction workflow.
# Edit dataset paths, available representations, and enabled reductions as needed.

global:
  # Base output directory and location of precomputed representations.
  output_root: "../.."
  embedding_root: "../../numerical_representation_data"


dataset:
  # Input dataset and column names expected by the workflow.
  name: "test"
  input_data: "../data/test.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"


representations:
  # Representation entries used by reduction analyses.
  # Expected path:
  # <embedding_root>/<dataset.name>/<method>/<model_alias>/
  esm2_t6:
    label: "ESM2-8M"
    method: "sylphy_embedding"
    model: "facebook/esm2_t6_8M_UR50D"
    model_alias: "esm2_t6_8M_UR50D"
    prefix: "esm2_t6_8M_UR50D"

  # Uncomment only if these representation files already exist.
  # prot_t5:
  #   label: "ProtT5-XL"
  #   method: "sylphy_embedding"
  #   model: "Rostlab/prot_t5_xl_uniref50"
  #   model_alias: "prot_t5_xl_uniref50"
  #   prefix: "prot_t5"

  # onehot:
  #   label: "One-hot"
  #   method: "sylphy_one_hot"
  #   model: "one_hot"
  #   model_alias: "one_hot"
  #   prefix: "one_hot"
  #   feature_prefix: "p_"
  #   analysis:
  #     embedding_npy: null


reductions:
  embedding_distance:
    # Representation-aware reduction from percentile-based distance thresholds.
    enabled: true
    representation_keys:
      - "esm2_t6"
      # - "prot_t5"

    script: "../../notebooks_and_scripts/scripts_for_pipelines/run_biosieve_reducers_from_percentiles.py"
    biosieve_exec: "biosieve"
    strategy: "embedding_cosine"
    n_jobs: 8
    output_dir: null

  homology:
    # Sequence-level redundancy reduction with MMseqs2 through BioSieve.
    enabled: true
    label: "Homology MMseqs2"
    representation_key: "esm2_t6"
    experiment_name: "homology_mmseqs2_reduction"

    biosieve_exec: "biosieve"
    strategy: "mmseqs2"
    thresholds: [0.9, 0.7, 0.5, 0.3]
    coverage: 0.8
    extra_params: {}
    output_dir: null

  # onehot_descriptor:
  #   # Optional descriptor-based reduction for one-hot-style features.
  #   enabled: true
  #   label: "One-hot descriptor"
  #   representation_key: "onehot"
  #   experiment_name: "onehot_descriptor_reduction"

  #   script: "../../notebooks_and_scripts/scripts_for_pipelines/run_descriptor_euclidean_reduction.py"
  #   biosieve_exec: "biosieve"
  #   strategy: "descriptor_euclidean"
  #   descriptor_prefix: "p_"
  #   percentile_col: "percentile"
  #   threshold_col: "similarity"
  #   output_dir: null


analysis:
  # Generate summary tables and figures from reduction outputs.
  enabled: true
  script: "../../notebooks_and_scripts/scripts_for_pipelines/summary_reduction.py"
  output_dir: null

  general: true
  by_label: true
  fig_format: "png"
  dpi: 300
