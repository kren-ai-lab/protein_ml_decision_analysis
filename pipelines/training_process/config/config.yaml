# Training workflow configuration
#
# This config controls which validated split datasets are used for model
# training, which algorithms/scalers are executed, and where outputs are saved.
# The workflow reads split outputs generated by the split_dataset workflow.

global:
  # Project root used to resolve default input and output paths.
  output_root: "../.."

  # Kept for compatibility with broader pipeline configs.
  # The current Snakefile does not read this file; seed filtering is controlled
  # directly through selection.seeds below.
  seeds_file: "../../general_configs/random_seeds_30.csv"


dataset:
  # Dataset name and target label column used by the training script.
  name: "test"
  label_col: "label"


input:
  # Root folder containing split_dataset outputs.
  # If null, the workflow reads:
  # <output_root>/split_process/<dataset.name>
  split_root: null


output:
  # Root folder for training outputs.
  # If null, outputs are written to:
  # <output_root>/training_process/<dataset.name>
  root: null
  include_dataset_folder: true


selection:
  # Select which split runs should be trained.
  # Use "auto" to include all available values found in split_summary.csv files,
  # or provide explicit lists to restrict the training jobs.
  scenarios: "auto"
  strategies: "auto"
  seeds: "auto"
  reduction_levels: "auto"

  # Examples:
  # scenarios: ["esm2_t6_8M_UR50D_no_reduced"]
  # strategies: ["random_kfold", "stratified_kfold"]
  # seeds: [4617, 8596]
  # reduction_levels: ["no_threshold", "p90_0", "threshold_0.7"]

  # Only split_summary.csv rows with this status are used for training.
  required_status: "kept"


training:
  enabled: true

  # Training script and hyperparameter configuration file.
  script: "../../notebooks_and_scripts/scripts_for_pipelines/training_model_external_cv.py"
  config: "../../general_configs/config_hyperparameters_algorithm.json"

  # Algorithms must exist in config_hyperparameters_algorithm.json.
  algorithms:
    - "LogisticRegression"
    # - "RandomForestClassifier"
    # - "ExtraTreesClassifier"
    # - "SVC"
    # - "KNeighborsClassifier"
    # - "DecisionTreeClassifier"
    # - "GaussianNB"
    # - "XGBClassifier"

  # Scalers passed to training_model_external_cv.py.
  scalers:
    - "none"
    # - "standard"
    # - "minmax"

  # Feature columns are selected using this prefix.
  feature_prefix: "p_"

  # If true, the training script receives the --timestamp flag.
  timestamp: false

  # Additional command-line arguments passed directly to the training script.
  extra_args: ""


metadata:
  # The current Snakefile infers representation_strategy and redundancy_strategy
  # from the split scenario name. Keep scenario names consistent with the
  # split_dataset workflow whenever possible.
  infer_from_scenario: true

  # Use manual overrides only for scenario names that cannot be parsed reliably.
  scenario_overrides: {}
  # Example:
  # scenario_overrides:
  #   one_hot_no_reduced:
  #     representation_strategy: "one_hot"
  #     redundancy_strategy: "no_reduction"
