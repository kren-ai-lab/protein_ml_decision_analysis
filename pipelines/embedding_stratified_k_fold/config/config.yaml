global:
  output_root: "results"
  embedding_root: "../../numerical_representation_data"

dataset:
  name: "antioxidant_proteins"
  input_data: "../data/sequences.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"

experiment:
  name: "stratified_kfold_experiment"

representation:
  enabled: true
  run_embedding: false
  method: "sylphy_embedding"
  model: "facebook/esm2_t6_8M_UR50D"
  model_alias: "esm2_t6_8M_UR50D"
  device: "cuda"
  precision: "fp32"
  batch_size: 16
  output_format: "csv"

splits:
  enabled: true
  biosieve_exec: "biosieve"
  strategy: "stratified_kfold"
  n_splits: 5
  shuffle: true
  seed: 13
  val_size: 0.1
  dropna: true
  cast_to_str: false