global:
  embedding_root: "../../numerical_representation_data"

dataset:
  name: "antioxidant_proteins_full_consensus"
  input_data: "../data/sequences_full_consensus.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"

representation:
  enabled: true

  # true  = generate the representation if it does not exist
  # false = reuse an existing representation and only rebuild full_data if needed
  run_representation: true

  # Use one of:
  #method: "sylphy_one_hot"
  method: "sylphy_embedding"

  # For one-hot:
  #model: "one_hot"
  #model_alias: "one_hot"
  #encoder: "one_hot"
  #max_length: 1024

  # For embeddings:
  model: "facebook/esm2_t6_8M_UR50D"
  model_alias: "esm2_t6_8M_UR50D"
  device: "cuda"
  precision: "fp32"
  batch_size: 16

  # Important: leave as null for embeddings unless Sylphy supports/needs --max-length.
  # The fixed Snakefile only passes --max-length when this value is not null.
  max_length: null

  output_format: "csv"

analysis:
  enabled: true

  # Script that analyses the numerical space: PCA, UMAP, t-SNE,
  # cosine similarity distribution and percentiles.
  script: "../../notebooks_and_scripts/scripts_for_pipelines/embedding_analysis_space.py"

  # Optional. If omitted, outputs go to:
  # <representation_dir>/analysis
  # output_dir: "../../analysed_embedding_space/antioxidant_proteins/esm2_t6_8M_UR50D"

  feature_prefix: "p_"
  prefix: "esm2_t6_8M_UR50D"
  random_state: 42

  tsne_perplexity: 30.0
  tsne_max_iter: 1000

  umap_neighbors: 15
  umap_min_dist: 0.1
  umap_metric: "euclidean"

  scaling_strategy: "none"
